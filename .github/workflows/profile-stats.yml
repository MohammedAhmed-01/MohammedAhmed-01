name: Profile Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Generate stats cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          OUT: assets
        run: |
          mkdir -p assets
          python3 - <<'PY'
          """Generates animated GitHub stats cards as SVG files (no third-party services)."""
          import json, os, urllib.request, urllib.error

          USER = os.environ.get("USERNAME", "MohammedAhmed-01")
          TOKEN = os.environ.get("GITHUB_TOKEN", "")
          OUT = os.environ.get("OUT", "assets")
          FONT = "'Segoe UI','Helvetica Neue',Arial,sans-serif"
          os.makedirs(OUT, exist_ok=True)


          def api(url, data=None):
              headers = {"Accept": "application/vnd.github+json", "User-Agent": "profile-stats"}
              if TOKEN:
                  headers["Authorization"] = f"Bearer {TOKEN}"
              req = urllib.request.Request(url, data=data, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)


          def safe(fn, default):
              try:
                  return fn()
              except Exception as e:  # noqa
                  print("warn:", e)
                  return default


          user = safe(lambda: api(f"https://api.github.com/users/{USER}"), {})
          repos = safe(lambda: api(f"https://api.github.com/users/{USER}/repos?per_page=100&type=owner"), [])
          OK = bool(user)
          own = [r for r in repos if not r.get("fork")]
          stars = sum(r.get("stargazers_count", 0) for r in own)
          forks = sum(r.get("forks_count", 0) for r in own)

          langs = {}
          for r in own[:40]:
              d = safe(lambda: api(r["languages_url"]), {})
              for k, v in d.items():
                  langs[k] = langs.get(k, 0) + v

          contrib = None
          if TOKEN:
              q = ('{ user(login:"%s") { contributionsCollection { totalCommitContributions '
                   'totalPullRequestContributions totalIssueContributions '
                   'contributionCalendar { totalContributions } } } }' % USER)
              res = safe(lambda: api("https://api.github.com/graphql", json.dumps({"query": q}).encode()), {})
              contrib = (res.get("data", {}).get("user") or {}).get("contributionsCollection")

          metrics = [
              ("Repositories", user.get("public_repos", len(own)), "#58A6FF"),
              ("Stars Earned", stars, "#F2C811"),
              ("Followers", user.get("followers", 0), "#FF7AC6"),
              ("Following", user.get("following", 0), "#8957E5"),
          ]
          if contrib:
              metrics += [
                  ("Commits (1y)", contrib["totalCommitContributions"], "#3FB950"),
                  ("Pull Requests", contrib["totalPullRequestContributions"], "#58A6FF"),
                  ("Issues", contrib["totalIssueContributions"], "#FF9900"),
                  ("Contributions (1y)", contrib["contributionCalendar"]["totalContributions"], "#FF7AC6"),
              ]
          else:
              metrics += [("Forks", forks, "#3FB950"), ("Total Repos Listed", len(repos), "#FF9900")]

          SHINE = '''<linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="490" y2="0" spreadMethod="repeat">
          <stop offset="0" stop-color="#58A6FF"/><stop offset="0.33" stop-color="#8957E5"/><stop offset="0.66" stop-color="#FF7AC6"/><stop offset="1" stop-color="#58A6FF"/>
          <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="490 0" dur="5s" repeatCount="indefinite"/></linearGradient>'''
          FRAME = '<rect x="1" y="1" width="488" height="268" rx="18" fill="#0D1117" stroke="#30363D"/>'


          def title(t):
              return (f'<text x="245" y="42" text-anchor="middle" font-family="{FONT}" font-size="20" font-weight="800" '
                      f'letter-spacing="4" fill="url(#shine)">{t}</text>'
                      '<rect x="120" y="54" width="250" height="2" rx="1" fill="url(#shine)"/>')


          # ── stats card ──
          cells = []
          for i, (label, val, color) in enumerate(metrics):
              col, row = i % 2, i // 2
              x, y = 24 + col * 224, 74 + row * 48
              cells.append(f'''<g transform="translate({x} {y})"><animate attributeName="opacity" from="0" to="1" begin="{i*0.15:.2f}s" dur="0.6s" fill="freeze"/>
          <rect width="212" height="40" rx="10" fill="{color}" fill-opacity="0.08" stroke="{color}" stroke-opacity="0.45"/>
          <rect x="0" y="8" width="4" height="24" rx="2" fill="{color}"/>
          <text x="18" y="26" font-family="{FONT}" font-size="12.5" fill="#8B949E">{label}</text>
          <text x="198" y="27" text-anchor="end" font-family="{FONT}" font-size="19" font-weight="800" fill="{color}">{val if OK else "—"}</text></g>''')
          stats = f'''<svg xmlns="http://www.w3.org/2000/svg" width="490" height="270" viewBox="0 0 490 270" role="img" aria-label="GitHub stats">
          <defs>{SHINE}</defs>{FRAME}{title("GITHUB STATS")}{''.join(cells)}</svg>'''
          open(os.path.join(OUT, "stats-card.svg"), "w", encoding="utf-8").write(stats)

          # ── languages card ──
          COLORS = {"Python": "#3572A5", "Jupyter Notebook": "#DA5B0B", "SQL": "#e38c00", "TSQL": "#e38c00", "HTML": "#E34C26",
                    "CSS": "#563D7C", "JavaScript": "#F1E05A", "TypeScript": "#3178C6", "Shell": "#89E051", "Java": "#B07219",
                    "PLpgSQL": "#336790", "Scala": "#C22D40", "R": "#198CE7", "C++": "#F34B7D", "Dockerfile": "#384D54"}
          FALL = ["#58A6FF", "#8957E5", "#FF7AC6", "#F2C811", "#3FB950", "#FF9900"]
          total = sum(langs.values()) or 1
          top = sorted(langs.items(), key=lambda kv: -kv[1])[:6]
          rows = []
          for i, (name, b) in enumerate(top):
              pct = b / total * 100
              color = COLORS.get(name, FALL[i % len(FALL)])
              y = 78 + i * 31
              w = max(4, 270 * pct / 100)
              rows.append(f'''<g><text x="24" y="{y+11}" font-family="{FONT}" font-size="13" font-weight="600" fill="#E6EDF3">{name}</text>
          <rect x="150" y="{y}" width="270" height="12" rx="6" fill="#161B22"/>
          <rect x="150" y="{y}" width="{w:.1f}" height="12" rx="6" fill="{color}"><animate attributeName="width" from="0" to="{w:.1f}" begin="{0.2+i*0.2:.1f}s" dur="1.1s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></rect>
          <text x="466" y="{y+11}" text-anchor="end" font-family="{FONT}" font-size="12" fill="#8B949E">{pct:.1f}%</text></g>''')
          if not rows:
              rows.append(f'<text x="245" y="150" text-anchor="middle" font-family="{FONT}" font-size="14" fill="#8B949E">Data loads after the first workflow run</text>')
          langs_svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="490" height="270" viewBox="0 0 490 270" role="img" aria-label="Top languages">
          <defs>{SHINE}</defs>{FRAME}{title("TOP LANGUAGES")}{''.join(rows)}</svg>'''
          open(os.path.join(OUT, "langs-card.svg"), "w", encoding="utf-8").write(langs_svg)
          print("stats:", metrics, "langs:", top)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-card.svg assets/langs-card.svg
          git diff --cached --quiet || git commit -m "chore: update profile stats"
          git push
