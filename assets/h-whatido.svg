<rect x="200" y="78" width="600" height="2" fill="url(#line)"><animate attributeName="opacity" values=".35;1;.35" dur="3s" repeatCount="indefinite"/></rect>
<circle r="3.5" fill="#fff" filter="url(#glow)"><animateMotion dur="3.2s" repeatCount="indefinite" path="M200 79 H800"/></circle>
