<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="100" viewBox="0 0 1000 100" role="img" aria-label="WHAT I DO" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0" spreadMethod="repeat">
  <stop offset="0" stop-color="#58A6FF"/><stop offset="0.33" stop-color="#8957E5"/>
  <stop offset="0.66" stop-color="#FF7AC6"/><stop offset="1" stop-color="#58A6FF"/>
  <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1000 0" dur="5s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D1117"/><stop offset="0.5" stop-color="#121c3a"/><stop offset="1" stop-color="#0D1117"/></linearGradient>
<linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#58A6FF" stop-opacity="0"/><stop offset="0.5" stop-color="#8957E5"/><stop offset="1" stop-color="#FF7AC6" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
.t{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:42px;font-weight:800;letter-spacing:6px;fill:url(#shine);stroke:url(#shine);stroke-width:1.2;stroke-dasharray:1200;animation:cycle 9s ease-in-out infinite}
@keyframes cycle{0%{stroke-dashoffset:1200;fill-opacity:0}28%{stroke-dashoffset:0;fill-opacity:0}42%{stroke-dashoffset:0;fill-opacity:1}88%{stroke-dashoffset:0;fill-opacity:1}96%{stroke-dashoffset:0;fill-opacity:0}100%{stroke-dashoffset:1200;fill-opacity:0}}
</style>
<rect x="1" y="1" width="998" height="98" rx="18" fill="url(#bg)" stroke="#30363D"/>
<g fill="none" stroke="#58A6FF" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
<path d="M18 34 V20 Q18 14 24 14 H38"/><path d="M982 34 V20 Q982 14 976 14 H962"/>
<path d="M18 66 V80 Q18 86 24 86 H38"/><path d="M982 66 V80 Q982 86 976 86 H962"/>
</g>
<g fill="#58A6FF"><circle cx="70" cy="50" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle>
<circle cx="930" cy="50" r="3" fill="#FF7AC6"><animate attributeName="opacity" values="1;.2;1" dur="2s" repeatCount="indefinite"/></circle></g>
