<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Mohammed Salah - Data &amp; Analytics Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="0.5" stop-color="#121c3a"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>

    <!-- moving shimmer gradient for the name -->
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#58A6FF"/>
      <stop offset="0.33" stop-color="#8957E5"/>
      <stop offset="0.66" stop-color="#FF7AC6"/>
      <stop offset="1" stop-color="#58A6FF"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1000 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8957E5"/>
      <stop offset="1" stop-color="#FF7AC6" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="reveal">
      <rect x="0" y="150" width="0" height="60">
        <animate attributeName="width" from="0" to="1000" begin="2.8s" dur="2.2s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .name {
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      font-size: 84px; font-weight: 800; letter-spacing: 6px;
      fill: url(#shine); fill-opacity: 0;
      stroke: url(#shine); stroke-width: 1.6;
      stroke-dasharray: 1800; stroke-dashoffset: 1800;
      animation: draw 2.6s ease-out forwards, fillin 1.2s ease-in 2.2s forwards;
    }
    .hello {
      font-family: 'Courier New', monospace; font-size: 17px; letter-spacing: 4px;
      fill: #58A6FF; opacity: 0; animation: fade 1s ease 0.2s forwards;
    }
    .role {
      font-family: 'Segoe UI', Arial, sans-serif; font-size: 28px;
      letter-spacing: 9px; fill: #a8b2d8; font-weight: 600;
    }
    .ring { transform-origin: 500px 140px; animation: spin 24s linear infinite; }
    .ring2 { transform-origin: 500px 140px; animation: spin 36s linear infinite reverse; }
    @keyframes draw   { to { stroke-dashoffset: 0; } }
    @keyframes fillin { to { fill-opacity: 1; } }
    @keyframes fade   { to { opacity: 1; } }
    @keyframes spin   { to { transform: rotate(360deg); } }
    @keyframes pulse  { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  </style>

  <rect width="1000" height="280" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="998" height="278" rx="21" fill="none" stroke="#30363D"/>

  <!-- rotating rings -->
  <g opacity="0.35" fill="none">
    <ellipse class="ring" cx="500" cy="140" rx="470" ry="105" stroke="#58A6FF" stroke-width="1" stroke-dasharray="4 14"/>
    <ellipse class="ring2" cx="500" cy="140" rx="430" ry="85" stroke="#8957E5" stroke-width="1" stroke-dasharray="2 10"/>
  </g>

  <!-- floating particles -->
  <g fill="#58A6FF">
    <circle cx="70"  cy="60"  r="3"><animate attributeName="cy" values="60;40;60"   dur="4s"   repeatCount="indefinite"/><animate attributeName="opacity" values=".2;1;.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="220" r="2"><animate attributeName="cy" values="220;195;220" dur="5s"  repeatCount="indefinite"/><animate attributeName="opacity" values=".2;1;.2" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="40"  r="2"><animate attributeName="cy" values="40;60;40"   dur="3.5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".2;1;.2" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="245" r="3"><animate attributeName="cy" values="245;225;245" dur="4.5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".2;1;.2" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="580" cy="35"  r="2"><animate attributeName="cy" values="35;55;35"   dur="5.5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".2;1;.2" dur="5.5s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#FF7AC6">
    <circle cx="700" cy="235" r="3"><animate attributeName="cy" values="235;212;235" dur="4.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".2;1;.2" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="50"  r="2"><animate attributeName="cy" values="50;72;50"   dur="3.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".2;1;.2" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="210" r="3"><animate attributeName="cy" values="210;188;210" dur="5s"  repeatCount="indefinite"/><animate attributeName="opacity" values=".2;1;.2" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="80"  r="2"><animate attributeName="cy" values="80;60;80"   dur="4.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".2;1;.2" dur="4.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- text -->
  <text class="hello" x="500" y="62" text-anchor="middle">&lt;/&gt;  HELLO WORLD, I'M</text>

  <g filter="url(#glow)">
    <text class="name" x="500" y="150" text-anchor="middle">MOHAMMED SALAH</text>
  </g>

  <rect x="150" y="172" width="700" height="2" fill="url(#line)">
    <animate attributeName="opacity" values=".3;1;.3" dur="3s" repeatCount="indefinite"/>
  </rect>

  <g clip-path="url(#reveal)">
    <text class="role" x="500" y="212" text-anchor="middle">DATA &amp; ANALYTICS ENGINEER</text>
  </g>

  <!-- blinking cursor -->
  <rect x="487" y="238" width="26" height="4" rx="2" fill="#58A6FF">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
